<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>suzukiyo.github.io</title>
    <!--
      GitHub Pages has no server-side routing, so any deep link (e.g. /about)
      lands here. Stash the intended URL and bounce to index.html, which
      restores it before React Router mounts. See index.html for the other
      half of this trick. https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      sessionStorage.redirect = location.href
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body></body>
</html>
