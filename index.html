<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="suzukiyo.github.io - フリーランスエンジニア suzukiyo のポートフォリオサイト"
    />
    <title>suzukiyo.github.io</title>
    <!--
      GitHub Pages serves static files only, so a hard refresh on a route like
      /about would 404. public/404.html forwards the original path here via
      sessionStorage; this restores it before React Router takes over.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function () {
        const redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
